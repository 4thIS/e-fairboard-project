; e-Paper 노드 펌웨어 (ESP32 + UART LoRa HAT + Waveshare 12.48" (B) V2 3색).
; 상태머신은 lib/node_core 에 하드웨어 의존 없이 들어있고, src/main_hat1248.cpp 만 Arduino/드라이버를 안다.
; MVP는 상시 수신 — 딥슬립은 서버 STATUS 폴링(15초)과 wake 윈도우 협의가 필요해 범위 밖.

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
lib_extra_dirs = ../shared/lib
; templates.h 가 templates.py 와 어긋나면 여기서 세운다 — 팀원이 늘 돌리는 명령이 가드다.
extra_scripts = pre:../tools/check_drift.py

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 베이크 폰트 3벌(32/48/64px, ~2.3MB)이 기본 앱 파티션(1.3MB)을 넘는다 — app 3MB (SPIFFS 없음)
board_build.partitions = huge_app.csv
lib_extra_dirs = ../shared/lib
extra_scripts =
    ; 생성물(templates.h / golden_vectors.h)이 소스와 어긋나면 빌드를 세운다 (이슈 #12)
    pre:../tools/check_drift.py
    ; assets/efb_common{32,48,64}.bin → src/font_data.cpp (rodata). 생성물은 커밋하지 않는다.
    pre:scripts/gen_font_data.py
; RadioLib·GxEPD2 는 구버전(main.cpp 2.9" / main_hat.cpp 7.5") 전용이라 제거됨.
; 현행 12.48" 는 UART HAT + lib/epd12in48b 드라이버라 QR 라이브러리만 쓴다.
lib_deps =
    ricmoo/QRCode@^0.0.1

; NodeID 는 펌웨어에 박힌다 — 노드마다 다른 env 로 플래시한다.
; src/ 에 main_hat1248.cpp 하나만 있으므로 build_src_filter 는 기본값(+<*>)으로 충분하다.
; 12.48"(1304x984, (B) V2 3색) 변형 — UART LoRa HAT + 점퍼 22가닥 배선 (main_hat1248.cpp, 효민).
[env:hat1248_node1]
extends = esp32_base
build_flags = -D EFB_NODE_ID=0x01
upload_port = COM5
monitor_port = COM5

; 2호기 — 노드 ID만 0x02. CH343 두 대라 COM 번호가 다르다 (1호기=COM5, 2호기=COM3).
[env:hat1248_node2]
extends = esp32_base
build_flags = -D EFB_NODE_ID=0x02
upload_port = COM3
monitor_port = COM3
