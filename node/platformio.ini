; e-Paper 노드 펌웨어 (ESP32 + Core1262 + e-Paper 2.9").
; 상태머신은 lib/node_core 에 하드웨어 의존 없이 들어있고, src/main.cpp 만 Arduino를 안다.
; MVP는 상시 수신 — 딥슬립은 서버 STATUS 폴링(15초)과 wake 윈도우 협의가 필요해 범위 밖.

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
lib_extra_dirs = ../shared/lib
; templates.h 가 templates.py 와 어긋나면 여기서 세운다 — 팀원이 늘 돌리는 명령이 가드다.
extra_scripts = pre:../tools/check_drift.py

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../shared/lib
extra_scripts =
    ; 생성물(templates.h / golden_vectors.h)이 소스와 어긋나면 빌드를 세운다 (이슈 #12)
    pre:../tools/check_drift.py
    ; assets/efb_hangul16.bin → src/font_data.cpp (PROGMEM). 생성물은 커밋하지 않는다.
    pre:scripts/gen_font_data.py
lib_deps =
    jgromes/RadioLib@^7.1.0
    zinggjm/GxEPD2@^1.5.8
    ricmoo/QRCode@^0.0.1

; NodeID 는 펌웨어에 박힌다 — 노드마다 다른 env 로 플래시한다.
[env:esp32dev]
extends = esp32_base
build_src_filter = +<*> -<main_hat.cpp>
build_flags = -D EFB_NODE_ID=0x01

[env:esp32dev_node2]
extends = esp32_base
build_src_filter = +<*> -<main_hat.cpp>
build_flags = -D EFB_NODE_ID=0x02

; 임시 프로토타입 변형 — UART LoRa HAT + 7.5"(B) 드라이버보드 (main_hat.cpp, 효민).
; RadioLib 은 링크만 되고 사용 안 함. 업로드 포트는 실제 COM 번호로.
[env:hat75_node1]
extends = esp32_base
build_src_filter = +<*> -<main.cpp>
build_flags = -D EFB_NODE_ID=0x01
upload_port = COM5
monitor_port = COM5
