; e-Paper 노드 펌웨어 (ESP32 + Core1262 + e-Paper 2.9").
; 상태머신은 lib/node_core 에 하드웨어 의존 없이 들어있고, src/main.cpp 만 Arduino를 안다.
; MVP는 상시 수신 — 딥슬립은 서버 STATUS 폴링(15초)과 wake 윈도우 협의가 필요해 범위 밖.

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
lib_extra_dirs = ../shared/lib

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../shared/lib
lib_deps =
    jgromes/RadioLib@^7.1.0
    zinggjm/GxEPD2@^1.5.8
    ricmoo/QRCode@^0.0.1

; NodeID 는 펌웨어에 박힌다 — 노드마다 다른 env 로 플래시한다.
[env:esp32dev]
extends = esp32_base
build_flags = -D EFB_NODE_ID=0x01

[env:esp32dev_node2]
extends = esp32_base
build_flags = -D EFB_NODE_ID=0x02
