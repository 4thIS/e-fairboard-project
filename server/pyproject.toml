[project]
name = "efairboard-server"
version = "0.1.0"
description = "E-FairBoard 중앙 관리 서버 (FastAPI + 시리얼 브리지)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pyserial>=3.5",
    "apscheduler>=3.10",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
