; efb_protocol 공유 라이브러리 — 펌웨어가 아니라 호스트 테스트 전용 프로젝트.
; gateway/ 와 node/ 가 lib_extra_dirs 로 lib/ 를 참조한다.

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
; 생성물(golden_vectors.h / templates.h)이 소스와 어긋나면 빌드를 세운다 (이슈 #12)
extra_scripts = pre:../tools/check_drift.py
