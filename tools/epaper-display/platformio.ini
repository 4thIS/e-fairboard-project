; e-Paper 표시 모듈 테스트베드 — 효민 (hm)
; 보드: Waveshare e-Paper ESP32 Driver Board + 7.5" 3색 패널(800x480)
; 사용법:
;   pio run -t upload        (COM 포트는 upload_port 수정)
;   pio device monitor       후 텍스트 한 줄 입력 → 화면에 표시

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
build_src_filter = +<*> -<disptest.cpp> -<test1248.cpp>
lib_deps =
    zinggjm/GxEPD2 @ ^1.6.1
    adafruit/Adafruit GFX Library @ ^1.11.9

; 패널 진단용 — 검정/흰/빨강 전체 칠하기 (선행 프로젝트 disptest 재사용)
[env:disptest]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
build_src_filter = -<*> +<disptest.cpp>
lib_deps =
    zinggjm/GxEPD2 @ ^1.6.1
    adafruit/Adafruit GFX Library @ ^1.11.9

; 12.48"(1304x984) 4분면 브링업 — 점퍼 배선 검증 (HANDOFF_12in48 §5-1)
[env:test1248]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
build_src_filter = -<*> +<test1248.cpp>
lib_deps =
    zinggjm/GxEPD2 @ ^1.6.1
    adafruit/Adafruit GFX Library @ ^1.11.9

; 12.48" 배선 진단 — 서브패널별 BUSY 반응·전압 측정 (무반응 원인 분리용)
[env:probe1248]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
build_src_filter = -<*> +<probe1248.cpp>

; 12.48" 결정판 — Waveshare 공식 드라이버 이식판 (src/ws1248/, 핀만 우리 배선)
[env:wstest1248]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
build_src_filter = -<*> +<wstest1248.cpp> +<ws1248/>

; 12.48" 3색 (B) V2 판별 — 무늬+빨간띠 (src/ws1248b/)
[env:wsbtest1248]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
build_src_filter = -<*> +<wsbtest1248.cpp> +<ws1248b/>
