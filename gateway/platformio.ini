; LoRa 게이트웨이 펌웨어 (ESP32 + Core1262).
; 서버(USB 시리얼, COBS 프레임) <-> LoRa 무선의 무상태 중계기.
; 재전송·ACK 대기·SEQ 발급은 서버 LinkManager 소관 — 게이트웨이는 관여하지 않는다.

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
lib_extra_dirs = ../shared/lib

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
lib_extra_dirs = ../shared/lib
lib_deps = jgromes/RadioLib@^7.1.0
